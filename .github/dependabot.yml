version: 2
updates:
  # Root manifest covers the npm workspaces (apps/*, packages/*).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem-wide bump rather than a dozen; CI still gates each.
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  # Outside the workspaces on purpose (see tools/docgen/package.json).
  - package-ecosystem: npm
    directory: /tools/docgen
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
