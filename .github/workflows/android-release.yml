name: Android Release Build & Signing

# This workflow holds the Play upload signing key. It therefore has NO
# `pull_request` trigger and no branch-push trigger: a workflow that runs on
# `pull_request` runs the file as the contributor wrote it, which would let
# anyone who can push a branch rewrite these steps and exfiltrate a key that
# cannot be rotated without Google's intervention. Pull-request and branch
# verification lives in android-verify.yml, which references no secrets.
#
# The only ways in are a tag matching v*.*.* and a manual dispatch, and both
# land in the `release` GitHub Environment so required reviewers gate the
# secrets. No `paths` filter: a release must never be silently skipped
# because a tag happened not to touch apps/android.
on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

# Read-only. The signed APK and AAB leave via actions/upload-artifact, which
# uses the Actions runtime token rather than GITHUB_TOKEN, so no write scope
# is needed. Nothing here creates a GitHub Release, pushes a commit, or
# comments on a PR.
permissions:
  contents: read

jobs:
  release:
    name: Sign & Publish Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers / deployment branch rules on this environment are the
    # human gate in front of the signing key.
    environment: release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Grant Execute Permission to Gradlew
        run: chmod +x apps/android/gradlew

      # The tag is the only source of the version that reaches Play. Without
      # this, every release carries the versionCode baked into build.gradle.kts,
      # and Play refuses an upload whose versionCode it has already accepted —
      # so the second release onwards fails at the upload step, after the
      # signing key has been decoded, used and shredded for nothing.
      - name: Derive Version From Tag
        run: |
          REF="${{ github.ref_name }}"
          if ! printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Expected a v<major>.<minor>.<patch> tag, got '$REF'."
            echo "::error::A manual dispatch must also be run from such a tag."
            exit 1
          fi
          VERSION="${REF#v}"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          # versionCode must strictly increase across uploads. This encoding
          # does that as long as minor and patch stay below 100, so the build
          # refuses rather than silently emitting a code that goes backwards.
          if [ "$MINOR" -ge 100 ] || [ "$PATCH" -ge 100 ]; then
            echo "::error::minor and patch must stay below 100 (got $VERSION)."
            exit 1
          fi
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "AZF_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "AZF_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Releasing $VERSION (versionCode $CODE)"

      # A tag push does not match android-verify.yml's `branches` filter, so
      # without these two steps a tag could be signed and shipped without lint
      # or tests ever running against that exact commit. They reference no
      # secrets and run before the keystore exists on disk.
      - name: Static Analysis (ktlint, detekt, Android Lint)
        working-directory: apps/android
        run: ./gradlew ktlintCheck detekt lintRelease --no-daemon

      - name: Run Unit Tests
        working-directory: apps/android
        run: ./gradlew test --no-daemon

      # The keystore has to exist on disk before Gradle runs. It is held as a
      # base64 secret because a GitHub secret is text; AZF_KEYSTORE_PATH alone
      # is a path to a file nothing ever created, which is how a "successful"
      # release workflow used to emit app-release-unsigned.apk.
      - name: Decode Release Keystore
        env:
          AZF_KEYSTORE_BASE64: ${{ secrets.AZF_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$AZF_KEYSTORE_BASE64" ]; then
            echo "::error::AZF_KEYSTORE_BASE64 is not set. Add it as a repository secret:"
            echo "::error::  base64 -w0 my-release-key.jks   (macOS: base64 -i my-release-key.jks)"
            exit 1
          fi
          printf '%s' "$AZF_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/azf-release.jks"
          # Prove it decoded to a real keystore before the build trusts it.
          keytool -list -keystore "$RUNNER_TEMP/azf-release.jks" \
            -storepass "${{ secrets.AZF_KEYSTORE_PASSWORD }}" > /dev/null
          echo "AZF_KEYSTORE_PATH=$RUNNER_TEMP/azf-release.jks" >> "$GITHUB_ENV"

      - name: Build Release APK
        working-directory: apps/android
        env:
          AZF_KEYSTORE_PASSWORD: ${{ secrets.AZF_KEYSTORE_PASSWORD }}
          AZF_KEY_ALIAS: ${{ secrets.AZF_KEY_ALIAS }}
          AZF_KEY_PASSWORD: ${{ secrets.AZF_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Android App Bundle (AAB for Google Play)
        working-directory: apps/android
        env:
          AZF_KEYSTORE_PASSWORD: ${{ secrets.AZF_KEYSTORE_PASSWORD }}
          AZF_KEY_ALIAS: ${{ secrets.AZF_KEY_ALIAS }}
          AZF_KEY_PASSWORD: ${{ secrets.AZF_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      # The build succeeding is not evidence the artifact is signed. Assert it
      # directly, and fail if an unsigned APK ever reaches this point.
      - name: Verify APK Is Signed
        working-directory: apps/android
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n1)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "Verifying $APK"
          case "$APK" in
            *unsigned*)
              echo "::error::Built an UNSIGNED release APK: $APK"
              exit 1
              ;;
          esac
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      # The AAB is the artifact Play actually receives, and it was never
      # checked here — only the APK was. They share a signingConfig, so this
      # should never fire, which is exactly the argument that was made for not
      # checking the APK either. apksigner cannot read a bundle; an AAB is a
      # jar, so jarsigner is what verifies its signature block.
      - name: Verify AAB Is Signed
        working-directory: apps/android
        run: |
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -n1)
          if [ -z "$AAB" ]; then
            echo "::error::No AAB was produced."
            exit 1
          fi
          echo "Verifying $AAB"
          OUTPUT=$(jarsigner -verify -strict "$AAB" 2>&1) || true
          echo "$OUTPUT"
          case "$OUTPUT" in
            *"jar is unsigned"*)
              echo "::error::Built an UNSIGNED release bundle: $AAB"
              exit 1
              ;;
            *"jar verified"*)
              ;;
            *)
              echo "::error::Could not confirm the bundle is signed: $AAB"
              exit 1
              ;;
          esac

      - name: Shred Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/azf-release.jks"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aquazerofit-release-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Release AAB Bundle Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aquazerofit-release-aab
          path: apps/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
