name: CI

# The eval gate is a release gate on paper (AQF-10, AQF-14) but nothing ran it
# automatically. This workflow makes typecheck, tests and the safety eval a
# required signal on every push and pull request.
on:
  push:
    branches: [main, staging]
  pull_request:

# verify only reads the checkout and runs npm. api-image builds
# apps/api/Dockerfile and does not push it. Nothing creates a release, pushes
# a commit, or comments on a PR, so the default token needs no write scope.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real Postgres for the engage contract suite. PGlite already runs the
    # same cases in-process on every machine; this adds the server build the
    # API actually talks to (row locks across connections, the pg driver).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engage_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ENGAGE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/engage_test

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: npm

      # `npm ci` installs from the committed lockfile; a lockfile that has
      # drifted from package.json fails here rather than in a deployment.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Coverage rather than a bare test run: the thresholds in each workspace's
      # vitest.config.ts are a ratchet, so a change that deletes tests or adds
      # a large untested surface fails here instead of merging quietly.
      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      # Anything that ships to users. Dev-only advisories (vite/esbuild/vitest)
      # are reported by the next step but do not block: they are reachable
      # only by someone who can already run this repo's dev server, and
      # gating releases on them means a build that goes red on a Saturday for
      # a tool no user ever touches. Anything high-or-worse in the runtime
      # dependency tree does block.
      - name: Dependency scan (production tree)
        run: npm run audit:prod

      - name: Dependency scan (full tree, advisory)
        run: npm audit || true

      # Zero critical safety misses, zero allergen violations, zero plan-safety
      # failures. Blocks the build on any regression.
      - name: Safety eval gate
        run: npm run eval

      - name: Build
        run: npm run build

  # The runtime image copies node_modules itself. `npm test` cannot see a
  # package that the Dockerfile forgot to copy. The smoke step inside
  # apps/api/Dockerfile resolves the API import graph from the runtime stage
  # and fails this job when something like zod is missing. No registry push.
  api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build API image (no push)
        run: docker build -f apps/api/Dockerfile -t aquazerofit-api:ci .
