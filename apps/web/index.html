<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1416" />
    <meta
      name="description"
      content="AquaZeroFit — AI-powered wellness: log meals by photo, get adaptive training plans and personalised nutrition targets."
    />
    <title>AquaZeroFit</title>
    <!-- Development defaults only.

         `vite-plugins/seo.ts` strips the title, description, canonical and
         social tags out of this shell at build time and substitutes the ones
         belonging to each route, writing a separate HTML file per marketing
         page. What ships is never these values — they exist so `npm run dev`
         has something sensible in the tab. Editing them changes nothing that
         a crawler sees; edit MARKETING_ROUTES in src/lib/site.ts instead. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AquaZeroFit" />
    <meta property="og:title" content="AquaZeroFit — AI wellness with the maths in the open" />
    <meta
      property="og:description"
      content="Photograph a meal and see it counted. Calorie, macro and hydration targets you could recompute by hand, adaptive home training, and a coach grounded in your actual day."
    />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AquaZeroFit — AI wellness with the maths in the open" />
    <meta
      name="twitter:description"
      content="Photograph a meal and see it counted. Targets you could recompute by hand, adaptive home training, and a coach that knows its limits."
    />
    <meta name="twitter:image" content="/logo.png" />
    <!-- Icons and the Apple banner are NOT part of the per-route block that
         vite-plugins/seo.ts rewrites (it only touches title, description,
         canonical and the social tags), so unlike everything above these do
         ship exactly as written here. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Apple Smart App Banner — directs iOS Safari visitors to install
         Telegram, which then opens the AquaZeroFit Mini App. The app-id is
         Telegram's own App Store ID, not ours. -->
    <meta name="apple-itunes-app" content="app-id=686449807, app-argument=https://t.me/aquazerofitbot/app" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: a Mini App must paint before Google Fonts answers. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <style>#azf-boot { display: none !important; }</style>
      <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet"
      />
      <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      html, body { margin: 0; background: #0e1416; color: #dde4e5; }
      #azf-boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: "DM Sans", system-ui, sans-serif;
        background: #0e1416;
      }
      #azf-boot .mark {
        font-family: "Barlow Condensed", system-ui, sans-serif;
        font-weight: 700;
        letter-spacing: 0.04em;
        font-size: 28px;
        color: #8aebff;
      }
      #azf-boot .spin {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid rgba(138, 235, 255, 0.25);
        border-top-color: #8aebff;
        animation: azf-boot-spin 0.8s linear infinite;
      }
      #azf-boot p { margin: 0; font-size: 14px; color: #bbcdc9; }
      #azf-boot .bars { display: flex; flex-direction: column; gap: 8px; width: min(240px, 70vw); }
      #azf-boot .bars span {
        display: block;
        height: 10px;
        border-radius: 999px;
        background: rgba(138, 235, 255, 0.12);
      }
      #azf-boot .bars span:nth-child(2) { width: 78%; }
      #azf-boot .bars span:nth-child(3) { width: 52%; }
      @keyframes azf-boot-spin { to { transform: rotate(360deg); } }
    </style>
    <!-- The Telegram WebApp SDK is NOT loaded here.

         It used to be a blocking <script> from telegram.org on every page
         load, including the landing page — whose entire job is converting
         visitors who are not in Telegram yet. That put a render-blocking
         third-party request in front of the marketing site for everyone, and
         stalled it outright on the corporate networks that block telegram.org,
         which is exactly the audience the browser fallback exists for.

         src/lib/telegram.ts now detects a Mini App launch from the URL
         fragment Telegram supplies (no SDK needed) and fetches the script only
         then, with a timeout. On the web, telegram.org is never contacted. -->
  </head>
  <body>
    <div id="azf-boot" role="status" aria-live="polite">
      <div class="spin" aria-hidden="true"></div>
      <div class="mark">AquaZeroFit</div>
      <p>Loading your day…</p>
      <div class="bars" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
