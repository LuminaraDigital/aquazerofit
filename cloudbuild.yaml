# Build the monorepo image and replace the Cloud Run service.
#
# Operator command, from the repo root, after the IAM and Artifact Registry
# steps in docs/CLOUDFLARE_CUTOVER.md:
#   gcloud builds submit --project=aquazerofit --config=cloudbuild.yaml
#
# This config does not map aquazerofit.com and does not change Cloudflare DNS.
# IMAGE_URI and APP_VERSION_SHA in deploy/cloudrun/service.yaml are placeholders
# replaced below. The image tag is the commit SHA, not :latest.
substitutions:
  _REGION: australia-southeast1
  _AR_REPO: aquazerofit

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$COMMIT_SHA
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$COMMIT_SHA

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$COMMIT_SHA"
        sed \
          -e "s|IMAGE_URI|$${image}|g" \
          -e "s|APP_VERSION_SHA|$COMMIT_SHA|g" \
          deploy/cloudrun/service.yaml > /workspace/service.rendered.yaml
        gcloud run services replace /workspace/service.rendered.yaml \
          --region="${_REGION}" \
          --project="$PROJECT_ID" \
          --quiet

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
