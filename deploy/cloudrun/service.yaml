# Cloud Run API. The public hostname is the aquazerofit Worker, which proxies
# /api and /uploads here. This service is already live as aquazerofit-api.
#
# Do not apply this file by hand with the IMAGE_URI placeholder still in it.
# cloudbuild.yaml substitutes the image and the version, then runs
# `gcloud run services replace`. This file does not map a custom domain and
# does not read secret values.
#
# Single instance on purpose: the store hydrates once into memory. min and max
# are both 1, and AZF_INSTANCE_COUNT=1 makes boot refuse anything else.
# CPU is always allocated so that one warm instance keeps its flush queue.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aquazerofit-api
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cloudsql-instances: aquazerofit:australia-southeast1:azf-pg
    spec:
      timeoutSeconds: 300
      containers:
        - name: api
          image: IMAGE_URI
          ports:
            - name: http1
              containerPort: 4000
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /ready
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: NODE_ENV
              value: production
            - name: APP_VERSION
              value: APP_VERSION_SHA
            - name: AZF_INSTANCE_COUNT
              value: "1"
            - name: AZF_SEED_DEMO
              value: "false"
            - name: CORS_ORIGINS
              value: https://aquazerofit.com
            - name: APP_PUBLIC_URL
              value: https://aquazerofit.com
            # Grey-cloud DNS to Cloud Run is one hop. Do not raise this to 2
            # until an orange-cloud proxy is actually in front of run.app.
            - name: TRUST_PROXY
              value: "1"
            - name: MFA_REQUIRE_ADMIN
              value: "true"
            - name: MAIL_PROVIDER
              value: resend
            - name: PLAY_PACKAGE_NAME
              value: fit.aquazero.app
            - name: FORCE_HTTPS
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: DATABASE_URL
                  key: latest
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: JWT_ACCESS_SECRET
                  key: latest
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: MAIL_FROM
                  key: latest
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: RESEND_API_KEY
                  key: latest
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: TELEGRAM_BOT_TOKEN
                  key: latest
            - name: TELEGRAM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: TELEGRAM_WEBHOOK_SECRET
                  key: latest
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: TURNSTILE_SECRET_KEY
                  key: latest
            - name: TURNSTILE_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: TURNSTILE_SITE_KEY
                  key: latest
            # PLAY_SERVICE_ACCOUNT_JSON exists as a secret id but has no
            # versions, so it is not mounted. Play billing stays off until a
            # version is added and this env entry comes back.
