<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="2100" viewBox="0 0 1500 2100">
  <!--
    AQUA ZERO HEAVENS - Fighter 01: AKIN CELSUS "DIVINUS"
    Print master. 1500x2100 = 63.5x88.9mm at 600dpi. Card 001/033, first printing.
    The ART placeholder on the <image> element is replaced with the fighter
    render (base64 data URI) at build time by tools/cards/build-card.mjs -
    keeping this file a readable design source rather than a megabyte blob.
  -->
  <defs>
    <!-- Obsidian depth: near-black with a cold blue floor, darker at the edges -->
    <radialGradient id="bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#0d1722"/>
      <stop offset="55%" stop-color="#070d14"/>
      <stop offset="100%" stop-color="#020407"/>
    </radialGradient>
    <!-- The aura behind the fighter: brand cyan, hot centre -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <!-- Floor glow under the feet -->
    <radialGradient id="floor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0e7490" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <!-- Foil: gold that actually turns, dark to bright to dark -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a6d1f"/>
      <stop offset="22%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f6e27a"/>
      <stop offset="78%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7a5f1a"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6e27a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6d1f"/>
    </linearGradient>
    <!-- Ice-cyan for numerals -->
    <linearGradient id="ice" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="55%" stop-color="#8aebff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <!-- Holographic sheen: one diagonal pass of light across the whole face -->
    <linearGradient id="sheen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#bdefff" stop-opacity="0.07"/>
      <stop offset="58%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Stat plate glass -->
    <linearGradient id="plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b141d" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#04080d" stop-opacity="0.96"/>
    </linearGradient>
    <!-- Guilloche: fine engraved diagonals, the anti-counterfeit texture -->
    <pattern id="engrave" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#5eead4" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soften" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="face"><rect x="26" y="26" width="1448" height="2048" rx="44"/></clipPath>
  </defs>

  <!-- ===== CARD BODY ===== -->
  <rect x="0" y="0" width="1500" height="2100" rx="64" fill="#010305"/>
  <g clip-path="url(#face)">
    <rect x="26" y="26" width="1448" height="2048" fill="url(#bg)"/>
    <rect x="26" y="26" width="1448" height="2048" fill="url(#engrave)"/>

    <!-- Arena suggestion: a distant octagon ring of light, barely there -->
    <g opacity="0.20" filter="url(#soften)">
      <polygon points="750,330 1120,470 1275,830 1120,1190 750,1330 380,1190 225,830 380,470"
               fill="none" stroke="#22d3ee" stroke-width="2.5"/>
      <polygon points="750,410 1060,528 1190,830 1060,1132 750,1250 440,1132 310,830 440,528"
               fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    </g>

    <!-- Aura and floor -->
    <ellipse cx="750" cy="900" rx="620" ry="720" fill="url(#aura)"/>
    <ellipse cx="750" cy="1655" rx="480" ry="72" fill="url(#floor)" filter="url(#soft)"/>

    <!-- ===== FIGHTER ===== -->
    <image xlink:href="__ART__" x="320" y="188" width="860" height="1500" preserveAspectRatio="xMidYMax meet"/>

    <!-- ===== HEADER ===== -->
    <g>
      <text x="96" y="128" font-family="Arial" font-size="28" font-weight="700" fill="#d4af37" letter-spacing="6">QUADRANT I &#183; THE PROVING GROUND</text>
      <text x="96" y="216" font-family="Arial" font-size="44" font-weight="700" fill="url(#gold)" letter-spacing="20">DIVINUS</text>
      <text x="93" y="322" font-family="Arial" font-size="96" font-weight="900" fill="#f2fbff" letter-spacing="5">AKIN</text>
      <text x="93" y="428" font-family="Arial" font-size="96" font-weight="900" fill="#f2fbff" letter-spacing="5">CELSUS</text>
      <line x1="96" y1="464" x2="470" y2="464" stroke="url(#gold)" stroke-width="2.5"/>
    </g>

    <!-- Weight-class octagon, top right: the cage itself as the badge -->
    <g transform="translate(1306,196)">
      <polygon points="0,-104 73.5,-73.5 104,0 73.5,73.5 0,104 -73.5,73.5 -104,0 -73.5,-73.5"
               fill="#060c12" stroke="url(#gold)" stroke-width="4"/>
      <polygon points="0,-88 62.2,-62.2 88,0 62.2,62.2 0,88 -62.2,62.2 -88,0 -62.2,-62.2"
               fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.65"/>
      <text x="0" y="-30" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#d4af37" letter-spacing="2">MIDDLEWEIGHT</text>
      <text x="0" y="34" text-anchor="middle" font-family="Arial" font-size="58" font-weight="900" fill="#f2fbff">185</text>
      <text x="0" y="72" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#9fb8c6" letter-spacing="3">POUNDS</text>
    </g>

    <!-- Discipline rail, left, rotated: mirrors the tape rail opposite -->
    <g transform="translate(68,760) rotate(-90)" opacity="0.85">
      <text x="0" y="0" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#5f7d8f" letter-spacing="8">MUAY THAI &#183; LETHWEI &#183; TAEKWONDO &#183; MELBOURNE, AUS</text>
    </g>

    <!-- Tale of the tape, right rail, rotated: the collector's fine print -->
    <g transform="translate(1432,760) rotate(90)" opacity="0.85">
      <text x="0" y="0" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#5f7d8f" letter-spacing="8">HT 6'4" &#183; REACH 80" &#183; AGE 18 &#183; STANCE ORTHODOX</text>
    </g>

    <!-- ===== HOME TURF (Shen Engine: STANDING / GROUND) ===== -->
    <g transform="translate(750,1700)">
      <text x="0" y="-36" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#d4af37" letter-spacing="9">HOME TURF</text>
      <!-- STANDING: lit -->
      <g transform="translate(-128,0)">
        <rect x="-116" y="-27" width="232" height="54" rx="27" fill="#22d3ee" opacity="0.16"/>
        <rect x="-116" y="-27" width="232" height="54" rx="27" fill="none" stroke="#22d3ee" stroke-width="3"/>
        <text x="0" y="11" text-anchor="middle" font-family="Arial" font-size="29" font-weight="900" fill="#bdefff" letter-spacing="5">STANDING</text>
      </g>
      <!-- GROUND -->
      <g transform="translate(116,0)">
        <rect x="-96" y="-27" width="192" height="54" rx="27" fill="none" stroke="#31485a" stroke-width="2"/>
        <text x="0" y="10" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#4a6375" letter-spacing="5">GROUND</text>
      </g>
    </g>

    <!-- ===== STAT PLATE: health, specials with damage, power ===== -->
    <g>
      <rect x="76" y="1746" width="1348" height="262" rx="26" fill="url(#plate)" stroke="url(#gold)" stroke-width="2.5"/>
      <rect x="82" y="1752" width="1336" height="250" rx="22" fill="none" stroke="#dc2626" stroke-opacity="0.30" stroke-width="1.5"/>

      <!-- HEALTH -->
      <g transform="translate(253,0)">
        <text x="0" y="1798" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#d4af37" letter-spacing="8">HEALTH</text>
        <text x="0" y="1892" text-anchor="middle" font-family="Arial" font-size="100" font-weight="900" fill="url(#ice)">100</text>
        <g>
          <rect x="-122" y="1908" width="244" height="22" rx="6" fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.5"/>
          <rect x="-118" y="1912" width="20" height="14" fill="url(#ice)"/>
          <rect x="-94" y="1912" width="20" height="14" fill="url(#ice)"/>
          <rect x="-70" y="1912" width="20" height="14" fill="url(#ice)"/>
          <rect x="-46" y="1912" width="20" height="14" fill="url(#ice)"/>
          <rect x="-22" y="1912" width="20" height="14" fill="url(#ice)"/>
          <rect x="2" y="1912" width="20" height="14" fill="url(#ice)"/>
          <rect x="26" y="1912" width="20" height="14" fill="url(#ice)"/>
          <rect x="50" y="1912" width="20" height="14" fill="url(#ice)"/>
          <rect x="74" y="1912" width="20" height="14" fill="url(#ice)"/>
          <rect x="98" y="1912" width="20" height="14" fill="url(#ice)"/>
        </g>
        <text x="0" y="1966" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#5f7d8f" letter-spacing="4">HAND 6 &#183; MIDDLEWEIGHT</text>
      </g>
      <line x1="440" y1="1782" x2="440" y2="1972" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1.5"/>

      <!-- SPECIAL TECHNIQUES with printed damage -->
      <g>
        <text x="750" y="1793" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#d4af37" letter-spacing="8">SPECIAL TECHNIQUES</text>

        <text x="466" y="1836" font-family="Arial" font-size="28" font-weight="700" fill="#e8f6fc">JORAKHE FAD HANG <tspan font-size="20" font-weight="400" fill="#7d97a6">SPINNING HEEL KICK</tspan></text>
        <rect x="966" y="1808" width="72" height="40" rx="10" fill="#dc2626" fill-opacity="0.14" stroke="#dc2626" stroke-width="2"/>
        <text x="1002" y="1837" text-anchor="middle" font-family="Arial" font-size="27" font-weight="900" fill="#ff8f8f">18</text>

        <text x="466" y="1888" font-family="Arial" font-size="28" font-weight="700" fill="#e8f6fc">DOLGAE CHAGI <tspan font-size="20" font-weight="400" fill="#7d97a6">TORNADO KICK</tspan></text>
        <rect x="966" y="1860" width="72" height="40" rx="10" fill="#dc2626" fill-opacity="0.14" stroke="#dc2626" stroke-width="2"/>
        <text x="1002" y="1889" text-anchor="middle" font-family="Arial" font-size="27" font-weight="900" fill="#ff8f8f">15</text>

        <text x="466" y="1940" font-family="Arial" font-size="28" font-weight="700" fill="#e8f6fc">GOGOPLATA <tspan font-size="20" font-weight="400" fill="#7d97a6">SHIN CHOKE &#183; GROUND</tspan></text>
        <rect x="966" y="1912" width="72" height="40" rx="10" fill="#d4af37" fill-opacity="0.12" stroke="#d4af37" stroke-width="2"/>
        <text x="1002" y="1940" text-anchor="middle" font-family="Arial" font-size="22" font-weight="900" fill="#f0d78c">SUB</text>

        <text x="750" y="1986" text-anchor="middle" font-family="Georgia" font-style="italic" font-size="29" fill="#e9d698">&#8220;Again. Let&#8217;s go again.&#8221;</text>
      </g>
      <line x1="1070" y1="1782" x2="1070" y2="1972" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1.5"/>

      <!-- POWER -->
      <g transform="translate(1247,0)">
        <text x="0" y="1798" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#d4af37" letter-spacing="8">POWER</text>
        <text x="0" y="1900" text-anchor="middle" font-family="Arial" font-size="100" font-weight="900" fill="url(#ice)">+1</text>
        <text x="0" y="1966" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#5f7d8f" letter-spacing="3">x2 ON HOME TURF</text>
      </g>
    </g>

    <!-- ===== FOOTER ===== -->
    <g font-family="Arial" font-size="22" font-weight="700" fill="#5f7d8f">
      <text x="110" y="2041" letter-spacing="4">AZH&#8211;001 &#183; 01/33</text>
      <text x="750" y="2041" text-anchor="middle" letter-spacing="4" fill="#ef4444">&#9733;&#160;&#160;GRANDMASTER EDITION&#160;&#160;&#9733;</text>
      <text x="1390" y="2041" text-anchor="end" letter-spacing="3">&#169; 2026 LUMINARA DIGITAL</text>
    </g>

    <!-- Holo sheen over everything inside the frame -->
    <rect x="26" y="26" width="1448" height="2048" fill="url(#sheen)"/>
  </g>

  <!-- ===== FRAME ===== -->
  <!-- Gold master keyline with chamfered corners, cyan hairline echo inside -->
  <path d="M 118 40 L 1382 40 L 1460 118 L 1460 1982 L 1382 2060 L 118 2060 L 40 1982 L 40 118 Z"
        fill="none" stroke="url(#gold)" stroke-width="6"/>
  <path d="M 126 56 L 1376 56 L 1444 124 L 1444 1976 L 1376 2044 L 126 2044 L 56 1976 L 56 124 Z"
        fill="none" stroke="#dc2626" stroke-width="1.8" opacity="0.60"/>
  <!-- Corner jewels -->
  <g fill="url(#goldV)">
    <circle cx="79" cy="79" r="7"/>
    <circle cx="1421" cy="79" r="7"/>
    <circle cx="79" cy="2021" r="7"/>
    <circle cx="1421" cy="2021" r="7"/>
  </g>
</svg>
