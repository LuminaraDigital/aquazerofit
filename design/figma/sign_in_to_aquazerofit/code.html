<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

                    "on-surface": "#dde4e5",
                    "on-primary-fixed-variant": "#004e5a",

                    "outline": "#859397",

                    "surface-container-lowest": "#090f11",

                    "on-primary": "#00363e",
                    "secondary-fixed-dim": "#45dfa4",
                    "on-surface-variant": "#bbc9cd",
                    "tertiary-container": "#ffaab2",
                    "on-tertiary-container": "#94223a",
                    "on-primary-fixed": "#001f25",
                    "on-primary-container": "#005763",
                    "tertiary-fixed-dim": "#ffb2b9",
                    "secondary": "#45dfa4",
                    "surface-bright": "#343a3c",

            },
            "borderRadius": {

            "spacing": {

                    "container-margin": "1.25rem",
                    "element-gap-sm": "0.5rem",

            },

                    "headline-md-mobile": ["20px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "32px", "fontWeight": "600"}]

          },
        },
      }
    </script>
<style>
        body {
            background-color: #071A2B; /* Deep Ocean/Abyss Navy Base */
            color: #dde4e5;
            -webkit-font-smoothing: antialiased;
        }

        .glass-card {
            background: rgba(30, 76, 116, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(30, 76, 116, 0.4);
        }

        .cta-gradient {
            background: linear-gradient(135deg, #8aebff 0%, #45dfa4 100%);
        }

        .coral-error {
            color: #ffaab2; /* Tertiary Container / Coral-ish tint */
            border-color: #94223a;
        }

        .input-glow:focus-within {
            border-color: #8aebff;
            box-shadow: 0 0 10px rgba(138, 235, 255, 0.2);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md">
<!-- Auth Header (Simplified TopAppBar) -->
<header class="w-full px-container-margin py-8 flex items-center justify-between z-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="waves">waves</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tight text-primary">AquaZeroFit</h1>
</div>
<button class="font-label-md text-label-md text-secondary border border-secondary/30 px-4 py-2 rounded-full hover:bg-secondary/10 transition-colors" id="toggleAuth">
            Sign In
        </button>
</header>
<main class="flex-grow flex items-center justify-center px-container-margin pb-12">
<div class="w-full max-w-md">
<!-- Animated Ambient Background Layer -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute top-[40%] -right-[10%] w-[50%] h-[50%] bg-secondary/5 blur-[120px] rounded-full"></div>
</div>
<!-- Auth Container Card -->
<div class="glass-card rounded-xl p-card-padding relative z-10">
<div class="space-y-6" id="authContent">
<div class="space-y-2">
<h2 class="font-headline-lg text-headline-lg-mobile text-on-surface" id="authTitle">Create Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant" id="authSubtitle">Start your aquatic wellness journey today.</p>
</div>
<form class="space-y-section-gap/2" id="authForm" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-element-gap-sm">
<label class="block font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="input-glow flex items-center bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-4 transition-all">
<span class="material-symbols-outlined text-outline mr-3" data-icon="mail">mail</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-outline/50 font-body-md" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-element-gap-sm">
<label class="block font-label-md text-label-md text-on-surface-variant ml-1" for="password">Password</label>
<div class="input-glow flex items-center bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-4 transition-all coral-error" id="passwordContainer">
<span class="material-symbols-outlined text-outline mr-3" data-icon="lock">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-outline/50 font-body-md" id="password" placeholder="At least 8 characters" type="password" value="123"/>
<button class="focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-outline" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<!-- Validation Error State -->
<div class="flex items-center gap-1 mt-1 ml-1" id="errorState">
<span class="material-symbols-outlined text-tertiary-container text-sm" data-icon="error">error</span>
<span class="text-tertiary-container font-label-md text-[12px]">Password too short</span>
</div>
</div>
<!-- Submit Button -->
<button class="cta-gradient w-full h-14 rounded-xl font-label-md text-label-md font-bold text-on-primary-fixed shadow-lg shadow-primary/20 hover:opacity-90 active:scale-95 transition-all" type="submit">
                            Continue
                        </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 font-label-md text-label-md text-outline">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Auth -->
<button class="w-full h-14 rounded-xl border border-outline-variant bg-surface-container-low flex items-center justify-center gap-3 font-label-md text-label-md text-on-surface hover:bg-surface-container-high transition-colors">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Continue with Google
                    </button>
<p class="text-center font-label-md text-label-md text-on-surface-variant">
                        By continuing, you agree to our <a class="text-primary hover:underline" href="#">Terms of Service</a>.
                    </p>
</div>
</div>
</div>
</main>
<!-- Background Decoration Image (Hero Atmosphere) -->
<div class="fixed bottom-0 right-0 w-full md:w-1/2 h-[40vh] z-0 opacity-20" data-alt="A macro cinematic shot of crystal clear turquoise water ripples with caustic light reflections against a deep navy blue background. The aesthetic is high-performance, premium wellness, emphasizing purity and hydration with smooth fluid motions and a clean modern atmosphere. Digital art style with soft glowing cyan edges." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDYl-58dHFlxGGf7IVvKjN6iPPtGiquliilmViU_HzjY9oS-crA2nhTXvbPH7b4W7UDKyZ3jGsNqT-zoHUxnrtWdqy-cayK8ZAFvezKhk8Ja2D95BozHfazRjgdusH6XncOFudXuCNOQejcUh4ow3jsd3VyxHysaXOrMNk7TTRBbg5TfemXxqtByRREsvjHclLgwBACvX-UnsK8WGdecWMihzxya-30DQFXeAKjWu--msKmVEPgn58')"></div>
<script>
        const toggleBtn = document.getElementById('toggleAuth');
        const authTitle = document.getElementById('authTitle');
        const authSubtitle = document.getElementById('authSubtitle');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const passwordContainer = document.getElementById('passwordContainer');
        const errorState = document.getElementById('errorState');

        let isSignIn = false;

        toggleBtn.addEventListener('click', () => {
            isSignIn = !isSignIn;
            if (isSignIn) {
                authTitle.innerText = "Welcome Back";
                authSubtitle.innerText = "Dive back into your fitness metrics.";
                toggleBtn.innerText = "Create Account";
                // Hide error state on switch to focus on clean sign in
                errorState.classList.add('hidden');
                passwordContainer.classList.remove('coral-error');
            } else {
                authTitle.innerText = "Create Account";
                authSubtitle.innerText = "Start your aquatic wellness journey today.";
                toggleBtn.innerText = "Sign In";
                // Show error state for demo purpose as requested
                errorState.classList.remove('hidden');
                passwordContainer.classList.add('coral-error');
            }
        });

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = type === 'password' ? 'visibility_off' : 'visibility';
            togglePassword.querySelector('span').innerText = icon;
        });

        // Trigger validation appearance logic
        passwordInput.addEventListener('input', (e) => {
            if (e.target.value.length < 8 && e.target.value.length > 0) {
                passwordContainer.classList.add('coral-error');
                errorState.classList.remove('hidden');
            } else {
                passwordContainer.classList.remove('coral-error');
                errorState.classList.add('hidden');
            }
        });
    </script>
</body></html>
