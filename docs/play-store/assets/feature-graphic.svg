    <circle cx="54" cy="54" r="26" fill="none" stroke="#2FD9F4" stroke-width="3" stroke-opacity="0.55"/>
    <path fill="#2FD9F4" d="M54,36 C54,36 43,50.5 43,58.5 C43,64.8 47.9,69.5 54,69.5 C60.1,69.5 65,64.8 65,58.5 C65,50.5 54,36 54,36Z"/>
