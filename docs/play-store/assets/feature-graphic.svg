  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <circle cx="778" cy="250" r="330" fill="url(#glow)"/>
  <circle cx="778" cy="250" r="228" fill="none" stroke="#2FD9F4" stroke-opacity="0.10" stroke-width="1.5"/>
  <circle cx="778" cy="250" r="182" fill="none" stroke="#8AEBFF" stroke-opacity="0.08" stroke-width="1.5"/>
  <!-- Icon geometry transformed, not redrawn, so the graphic and the launcher
